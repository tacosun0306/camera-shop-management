services:
  - type: web
    name: camera-shop-backend
    runtime: node
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER
        value: true
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
